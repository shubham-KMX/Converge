# H2 in-memory database in PostgreSQL compatibility mode (no Docker needed for tests)
spring.datasource.url=jdbc:h2:mem:conference-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Point the resource server at a static JWK set URI so it does not try to reach
# Keycloak's issuer endpoint during context startup. The URI is never actually
# fetched in a context-load test since no requests are authenticated.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/conference-platform/protocol/openid-connect/certs
